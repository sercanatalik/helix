[package]
name = "helix-ai"
version = "0.1.0"
description = "Helix AI desktop scaffold"
edition = "2024"

[lib]
name = "helix_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "helix-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
notify = "6"

tokio = { version = "1.48", features = ["sync", "rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

rmcp = { version = "1.5", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
