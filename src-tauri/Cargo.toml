[package]
name = "helix-ai"
version = "0.1.0"
description = "Helix AI desktop scaffold"
edition = "2024"

[lib]
name = "helix_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "helix-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }

tokio = { version = "1.48", features = ["sync", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
